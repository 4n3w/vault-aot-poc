# 06 opt-agentinit-kv: AOT + deferred Mongo init, secrets rendered to /vault/secrets by a Vault Agent init container.
# Mongo creds: KV path secret/vault-startup-demo-mongo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opt-agentinit-kv
  labels: { app: opt-agentinit-kv }
spec:
  replicas: 0   # idle until benchmarked: 12 one-CPU pods would not fit next to 02-04 on a laptop
  selector: { matchLabels: { app: opt-agentinit-kv } }
  template:
    metadata:
      labels: { app: opt-agentinit-kv }
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: vault-startup-demo
        vault.hashicorp.com/service: http://vault-latency.vault.svc:8200
        vault.hashicorp.com/agent-inject-secret-db.password: secret/data/vault-startup-demo
        vault.hashicorp.com/agent-inject-template-db.password: |
          {{- with secret "secret/data/vault-startup-demo" -}}{{ index .Data.data "db.password" }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-spring.mongodb.username: secret/data/vault-startup-demo-mongo
        vault.hashicorp.com/agent-inject-template-spring.mongodb.username: |
          {{- with secret "secret/data/vault-startup-demo-mongo" -}}{{ index .Data.data "spring.mongodb.username" }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-spring.mongodb.password: secret/data/vault-startup-demo-mongo
        vault.hashicorp.com/agent-inject-template-spring.mongodb.password: |
          {{- with secret "secret/data/vault-startup-demo-mongo" -}}{{ index .Data.data "spring.mongodb.password" }}{{- end -}}
    spec:
      serviceAccountName: vault-startup-demo
      containers:
        - name: app
          image: vault-startup-mongo-files:local
          imagePullPolicy: IfNotPresent
          env:
            - { name: JAVA_TOOL_OPTIONS, value: "-Dspring.aot.enabled=true" }
            - { name: MONGO_INIT, value: "deferred" }
            - { name: MONGO_CREDS, value: "kv" }
          ports:
            - { name: http, containerPort: 8080 }
          # Same CPU/memory for every app: CPU limits dominate JVM startup time.
          resources:
            requests: { cpu: "1", memory: 768Mi }
            limits: { cpu: "1", memory: 768Mi }
          # Readiness only (1 s period) so pod-level timings aren't padded by a startup probe.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 1
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: opt-agentinit-kv
spec:
  selector: { app: opt-agentinit-kv }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# 06 opt-agentinit-dyn: AOT + deferred Mongo init, secrets rendered to /vault/secrets by a Vault Agent init container.
# Mongo creds: database engine: the agent reads database/creds once (both templates share the lease), so every pod gets its own Mongo user.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opt-agentinit-dyn
  labels: { app: opt-agentinit-dyn }
spec:
  replicas: 0   # idle until benchmarked: 12 one-CPU pods would not fit next to 02-04 on a laptop
  selector: { matchLabels: { app: opt-agentinit-dyn } }
  template:
    metadata:
      labels: { app: opt-agentinit-dyn }
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: vault-startup-demo
        vault.hashicorp.com/service: http://vault-latency.vault.svc:8200
        vault.hashicorp.com/agent-inject-secret-db.password: secret/data/vault-startup-demo
        vault.hashicorp.com/agent-inject-template-db.password: |
          {{- with secret "secret/data/vault-startup-demo" -}}{{ index .Data.data "db.password" }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-spring.mongodb.username: database/creds/vault-startup-demo-mongo
        vault.hashicorp.com/agent-inject-template-spring.mongodb.username: |
          {{- with secret "database/creds/vault-startup-demo-mongo" -}}{{ index .Data "username" }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-spring.mongodb.password: database/creds/vault-startup-demo-mongo
        vault.hashicorp.com/agent-inject-template-spring.mongodb.password: |
          {{- with secret "database/creds/vault-startup-demo-mongo" -}}{{ index .Data "password" }}{{- end -}}
    spec:
      serviceAccountName: vault-startup-demo
      containers:
        - name: app
          image: vault-startup-mongo-files:local
          imagePullPolicy: IfNotPresent
          env:
            - { name: JAVA_TOOL_OPTIONS, value: "-Dspring.aot.enabled=true" }
            - { name: MONGO_INIT, value: "deferred" }
            - { name: MONGO_CREDS, value: "dynamic" }
          ports:
            - { name: http, containerPort: 8080 }
          # Same CPU/memory for every app: CPU limits dominate JVM startup time.
          resources:
            requests: { cpu: "1", memory: 768Mi }
            limits: { cpu: "1", memory: 768Mi }
          # Readiness only (1 s period) so pod-level timings aren't padded by a startup probe.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 1
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: opt-agentinit-dyn
spec:
  selector: { app: opt-agentinit-dyn }
  ports:
    - { name: http, port: 80, targetPort: http }
