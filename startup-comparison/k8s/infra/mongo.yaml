# MongoDB for 05/06 (single node, no persistence - demo only). The apps reach it through the latency proxy
# (mongo-latency.vault.svc:27017); Vault's database engine talks to it directly (mongo.mongo.svc:27017).
# k3d.sh seeds it with mongo-seed.js. The root credentials are for Vault's database engine and the seed.
apiVersion: v1
kind: Namespace
metadata:
  name: mongo
---
apiVersion: v1
kind: Secret
metadata:
  name: mongo-root
  namespace: mongo
stringData:
  username: root
  password: root-s3cr3t
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: mongo
  labels: { app: mongo }
spec:
  replicas: 1
  selector: { matchLabels: { app: mongo } }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:8.0
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: { secretKeyRef: { name: mongo-root, key: username } }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mongo-root, key: password } }
          ports:
            - { name: mongo, containerPort: 27017 }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"] }
            periodSeconds: 2
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: mongo
spec:
  selector: { app: mongo }
  ports:
    - { name: mongo, port: 27017, targetPort: mongo }
