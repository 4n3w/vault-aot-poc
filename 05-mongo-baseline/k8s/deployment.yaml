# 05 mongo-kv-blocking: like 02 (Spring Cloud Vault -> Vault itself, AOT off by default), plus MongoDB.
# Creds: static Mongo user from KV secret/vault-startup-demo-mongo (one more KV read).
# Init:  indexes + cache loaded during bean creation; readiness includes Mongo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-kv-blocking
  labels: { app: mongo-kv-blocking }
spec:
  replicas: 0   # idle until benchmarked: 12 one-CPU pods would not fit next to 02-04 on a laptop
  selector: { matchLabels: { app: mongo-kv-blocking } }
  template:
    metadata:
      labels: { app: mongo-kv-blocking }
    spec:
      serviceAccountName: vault-startup-demo
      containers:
        - name: app
          image: vault-startup-mongo-baseline:local
          imagePullPolicy: IfNotPresent
          env:
            - { name: VAULT_ADDR, value: "http://vault-latency.vault.svc:8200" }
            - { name: SPRING_CONFIG_IMPORT, value: "vault://" }
            - { name: MONGO_INIT, value: "blocking" }
            - { name: MONGO_CREDS, value: "kv" }
            - { name: SPRING_CLOUD_VAULT_KV_APPLICATION_NAME, value: "vault-startup-demo,vault-startup-demo-mongo" }
            - { name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE, value: "readinessState,mongo" }
          ports:
            - { name: http, containerPort: 8080 }
          # Same CPU/memory for every app: CPU limits dominate JVM startup time.
          resources:
            requests: { cpu: "1", memory: 768Mi }
            limits: { cpu: "1", memory: 768Mi }
          # Readiness only (1 s period) so pod-level timings aren't padded by a startup probe.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 1
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-kv-blocking
spec:
  selector: { app: mongo-kv-blocking }
  ports:
    - { name: http, port: 80, targetPort: http }
---
